<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Doctor</title>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
    <header class="app-header">
        <h1>Excel Doctor</h1>
        <p>Phát hiện và tự động sửa lỗi công thức, định dạng trong file Excel.</p>
    </header>

    <main class="app-main">
        <div id="app" class="card">
            {% if content_fragment %}
                {{ content_fragment | safe }}
            {% else %}
                <h2>Tải lên file Excel</h2>
                <form action="/scan" method="post" enctype="multipart/form-data"
                      hx-post="/scan" 
                      hx-encoding="multipart/form-data"
                      hx-target="#app" 
                      hx-swap="innerHTML"
                      hx-indicator="#spinner"
                      class="upload-form">
                    
                    <div class="drop-zone" id="drop-zone">
                        <p>Kéo thả file .xlsx / .xlsm vào đây, hoặc click để chọn file</p>
                        <input type="file" name="file" id="file-input" accept=".xlsx,.xlsm" required>
                        <div id="selected-file" class="selected-file"></div>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn primary">Kiểm tra file</button>
                        <div id="spinner" class="htmx-indicator spinner"></div>
                    </div>
                </form>
            {% endif %}
        </div>
    </main>

    <script>
        // JS allowed per §6b:
        // 1. Drag and drop
        // 2. Showing the selected filename before submit
        // 3. Warning before leaving the page while a job is running
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const selectedFile = document.getElementById('selected-file');
        const form = document.querySelector('form.upload-form');

        if (fileInput && selectedFile) {
            fileInput.addEventListener('change', (e) => {
                if (fileInput.files.length > 0) {
                    selectedFile.textContent = `Đã chọn: ${fileInput.files[0].name}`;
                } else {
                    selectedFile.textContent = '';
                }
            });
        }

        if (dropZone && fileInput && form) {
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    fileInput.dispatchEvent(new Event('change'));
                    form.requestSubmit();
                }
            });
        }

        // 3. Warning before leaving the page while a job is running (§6b)
        let isJobRunning = false;
        document.body.addEventListener('htmx:beforeRequest', function(evt) {
            const path = (evt.detail && evt.detail.pathInfo) ? evt.detail.pathInfo.requestPath : '';
            if (path && (path.startsWith('/scan') || path.startsWith('/fix'))) {
                isJobRunning = true;
            }
        });
        document.body.addEventListener('htmx:afterOnLoad', function(evt) {
            const path = (evt.detail && evt.detail.pathInfo) ? evt.detail.pathInfo.requestPath : '';
            const trigger = (evt.detail && evt.detail.xhr) ? evt.detail.xhr.getResponseHeader('HX-Trigger') : null;
            if (trigger === 'scanDone' || (path && path.endsWith('/confirm'))) {
                isJobRunning = false;
            }
        });
        window.addEventListener('beforeunload', function(e) {
            if (isJobRunning) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
</body>
</html>
